<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il2CppDumper by AntiGravity Exss</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #e6c860;
            --gold-dark: #b8942a;
            --bg-dark: #1a1a1a;
            --bg-medium: #242424;
            --surface: #2d2d2d;
            --surface-light: #363636;
            --text: #e8e8e8;
            --text-muted: #9a9a9a;
            --border: #3a3a3a;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            padding: max(20px, env(safe-area-inset-top))
                     max(20px, env(safe-area-inset-right))
                     max(20px, env(safe-area-inset-bottom))
                     max(20px, env(safe-area-inset-left));
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            padding: 28px 24px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-line {
            height: 3px;
            width: 60px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        h2 {
            margin: 0 0 6px;
            font-size: 22px;
            text-align: center;
            color: var(--gold-light);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .credit {
            text-align: center;
            font-size: 12px;
            color: var(--gold);
            font-style: italic;
            margin-bottom: 24px;
            letter-spacing: 0.3px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }

        input[type="text"], select {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-medium);
            color: var(--text);
            font-size: 15px;
            transition: all 0.25s ease;
        }

        input[type="text"]::placeholder {
            color: #5a5a5a;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        [hidden] {
            display: none !important;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #1a1a1a;
            border: none;
            padding: 14px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.25);
        }

        button:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.2);
        }

        button:disabled {
            background: #4a4a4a;
            color: #8a8a8a;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-box {
            margin-top: 24px;
            padding: 16px;
            background: var(--bg-medium);
            border-radius: 10px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--gold);
            font-size: 14px;
            word-break: break-all;
        }

        .status-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        #currentPkg {
            font-size: 15px;
            font-weight: 600;
            color: var(--gold-light);
        }

        .info-text {
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
        }

        .footer span {
            color: var(--gold);
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-line"></div>
    <h2>Il2CppDumper</h2>
    <div class="subtitle">Runtime IL2CPP Metadata Dumper</div>
    <div class="credit">by AntiGravity Exss</div>

    <div class="form-group">
        <label for="pkgInput">Target Package Name</label>
        <input type="text" id="pkgInput" placeholder="com.example.game" autocomplete="off" spellcheck="false">
    </div>

    <button id="saveBtn">Save Configuration</button>

    <div class="status-box">
        <div class="status-title">Current Target</div>
        <div id="currentPkg">Loading...</div>
    </div>

    <div class="info-text">
        Note: You must restart the target game for the dumper to inject and take effect.
    </div>

    <div class="footer">
        Powered by <span>AntiGravity Exss</span>
    </div>
</div>

<script type="module">
    import { exec, toast, isKsuWebui, enableEdgeToEdge } from './kernelsu-alt.mjs';

    document.addEventListener('DOMContentLoaded', async () => {
        const pkgInput = document.getElementById('pkgInput');
        const saveBtn = document.getElementById('saveBtn');
        const currentPkgDisplay = document.getElementById('currentPkg');

        if (!isKsuWebui()) {
            currentPkgDisplay.textContent = 'Root WebUI bridge not available';
            pkgInput.disabled = true;
            saveBtn.disabled = true;
            toast('Open this WebUI from your root manager.');
            return;
        }

        enableEdgeToEdge(true).catch(() => {});

        async function loadCurrentPackage() {
            try {
                const { errno, stdout, stderr } = await exec('getprop persist.il2cppdumper.package');
                if (errno === 0) {
                    const currentPkg = stdout.trim();
                    currentPkgDisplay.textContent = currentPkg || '(None set)';
                } else {
                    currentPkgDisplay.textContent = 'Error reading property';
                    console.error('getprop error:', stderr);
                }
            } catch (err) {
                currentPkgDisplay.textContent = 'Error: API not available';
                console.error(err);
            }
        }

        saveBtn.addEventListener('click', async () => {
            const newPkg = pkgInput.value.trim();

            if (!/^[a-zA-Z0-9._]+$/.test(newPkg)) {
                toast('Invalid package name');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const { errno, stdout, stderr } = await exec(`setprop persist.il2cppdumper.package ${newPkg}`);
                if (errno === 0) {
                    currentPkgDisplay.textContent = newPkg || '(None set)';
                    toast(`Package set to ${newPkg}`);
                } else {
                    toast('Failed to save config!');
                    console.error('setprop error:', stderr);
                }
            } catch (err) {
                toast('Error: API not available');
                console.error(err);
            }

            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Configuration';
        });

        await loadCurrentPackage();
    });
</script>

</body>
</html>
